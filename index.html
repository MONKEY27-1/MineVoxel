<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MineVoxel</title>
  <link rel="stylesheet" href="styles/main.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="crosshair"></div>
  <div id="underwater-overlay" class="hidden"></div>

  <div id="hud">
    <div id="debug-overlay" class="hidden"></div>
    <div id="vitals" class="hidden">
      <div id="health-bar" class="vital-bar"><div id="health-fill" class="vital-fill health"></div></div>
      <div id="breath-bar" class="vital-bar"><div id="breath-fill" class="vital-fill breath"></div></div>
    </div>
    <div id="hotbar"></div>
  </div>

  <div id="start-screen">
    <div class="menu-box">
      <h1>MineVoxel</h1>
      <div class="menu-field">
        <label for="seed-input">World seed</label>
        <input id="seed-input" type="text" placeholder="Random" autocomplete="off" />
      </div>
      <div class="menu-field">
        <label>Game mode</label>
        <div class="mode-choice" id="mode-choice">
          <button type="button" class="mode-btn selected" data-mode="survival">Survival</button>
          <button type="button" class="mode-btn" data-mode="creative">Creative</button>
        </div>
      </div>
      <button id="play-btn" class="menu-primary-btn">Play</button>
      <button id="start-settings-btn" class="menu-secondary-btn">Settings</button>
    </div>
  </div>

  <div id="pointer-lock-overlay" class="hidden">
    <div id="pointer-lock-box">
      <h1>MineVoxel</h1>
      <p id="pointer-lock-prompt">Click to play</p>
      <p class="hint">WASD to move &middot; Space to jump/fly &middot; double-tap Space to toggle flight &middot; C to sneak/descend &middot; Shift to sprint</p>
      <p class="hint">Left-click break &middot; Right-click place &middot; 1-9 select block &middot; Esc to release mouse &middot; F3 for debug</p>
      <button id="pause-settings-btn" class="menu-secondary-btn">Settings</button>
    </div>
  </div>

  <div id="settings-panel" class="hidden">
    <div class="menu-box settings-box">
      <h2>Settings</h2>
      <div class="settings-row">
        <label>Render distance <span id="render-distance-val" class="settings-val">6</span></label>
        <input id="render-distance-slider" type="range" min="2" max="12" step="1" value="6" />
      </div>
      <div class="settings-row">
        <label>Mouse sensitivity <span id="sensitivity-val" class="settings-val">1.0x</span></label>
        <input id="sensitivity-slider" type="range" min="0.2" max="3" step="0.1" value="1" />
      </div>
      <div class="settings-row">
        <label>Master volume <span id="master-vol-val" class="settings-val">60%</span></label>
        <input id="master-vol-slider" type="range" min="0" max="100" step="1" value="60" />
      </div>
      <div class="settings-row">
        <label>Footstep volume <span id="footstep-vol-val" class="settings-val">100%</span></label>
        <input id="footstep-vol-slider" type="range" min="0" max="100" step="1" value="100" />
      </div>
      <div class="settings-row">
        <label>Block sound volume <span id="block-vol-val" class="settings-val">100%</span></label>
        <input id="block-vol-slider" type="range" min="0" max="100" step="1" value="100" />
      </div>
      <div class="settings-row">
        <label>Mob/combat volume <span id="mob-vol-val" class="settings-val">100%</span></label>
        <input id="mob-vol-slider" type="range" min="0" max="100" step="1" value="100" />
      </div>
      <div class="settings-row settings-checkbox-row">
        <label for="auto-jump-toggle">Auto-jump</label>
        <input id="auto-jump-toggle" type="checkbox" />
      </div>
      <div class="settings-row settings-checkbox-row">
        <label for="viewmodel-toggle">Held item view model</label>
        <input id="viewmodel-toggle" type="checkbox" checked />
      </div>
      <div class="settings-row">
        <label>View model FOV <span id="viewmodel-fov-val" class="settings-val">70</span></label>
        <input id="viewmodel-fov-slider" type="range" min="30" max="110" step="1" value="70" />
      </div>
      <div class="settings-row">
        <label>Hand side</label>
        <div class="mode-choice" id="hand-side-choice">
          <button type="button" class="mode-btn selected" data-hand="right">Right</button>
          <button type="button" class="mode-btn" data-hand="left">Left</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Controls</label>
        <div id="keybind-list"></div>
      </div>
      <button id="settings-back-btn" class="menu-secondary-btn">Back</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
